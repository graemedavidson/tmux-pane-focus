---
name: Linting and Unit Tests

on:
  push:
    branches: ['**']
    paths-ignore:
    - .github/dependabot.yml
    - .github/workflows/release.yml
    - '*.md'
    - '*.yaml'
    - .gitignore
    - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
    - .github/dependabot.yml
    - .github/workflows/release.yml
    - '*.md'
    - '*.yaml'
    - .gitignore
    - LICENSE

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: hadolint
      uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
      with:
        dockerfile: ./Dockerfile
      id: hadolint

    - name: ShellCheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
      id: shellcheck

  unittests:
    needs: linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install kcov
      run: |
        sudo apt-get update
        sudo apt-get install -y bash git kcov
      id: install-dependencies

    - name: Install Shellspec
      run: |
        cd /opt/
        sudo git clone https://github.com/shellspec/shellspec.git
        sudo ln -s /opt/shellspec/shellspec /usr/local/bin/shellspec
      id: install-shellspec

    - name: Run shellspec with kcov
      env:
        SHELLSPEC_KCOV_OPTS: "--include-pattern=*.sh"
      run: |
        shellspec -s bash --kcov

    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      if: github.ref == 'refs/heads/main'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/cobertura.xml
        flags: unittests
        fail_ci_if_error: true
        verbose: true
